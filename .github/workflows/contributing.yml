name: Contributing

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: contributing-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: deepakputhraya/action-branch-name@master
        with:
          regex: '^(issue-\d+-[a-z0-9]+(-[a-z0-9]+)*|(hotfix|trivial|maintenance|proposal)-[a-z0-9]+(-[a-z0-9]+)*|release-\d+\.\d+\.\d+)$'
          min_length: 5
          max_length: 100
          ignore: main,master

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ./commitlint.config.mjs
          failOnWarnings: false

  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            HOTFIX
            TRIVIAL
            MAINTENANCE
            PROPOSAL
            Release
            [A-Z]\w*
          headerPattern: '^([A-Z]\S*?):?\s+(.+)$'
          headerPatternCorrespondence: type, subject
          subjectPattern: '.*[^.]$'
          subjectPatternError: |
            PR title must not end with a period. See CONTRIBUTING.md §pr-titles.
      - name: Validate PR title length
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ ${#PR_TITLE} -gt 120 ]; then
            echo "::error::PR title exceeds 120 character limit (${#PR_TITLE} chars). See CONTRIBUTING.md §pr-titles."
            exit 1
          fi
