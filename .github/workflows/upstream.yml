name: Upstream

on:
  schedule:
    # Every hour at minute 0 (UTC). Picks up upstream agent rules and
    # contributing/boilerplate file changes within ~1h and opens (or
    # updates) maintenance PRs on `maintenance-sync-agents-rules` and
    # `maintenance-sync-contributing`.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: upstream-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync agent rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: awinogradov/code-assistants/.github/actions/agents-rules-sync@main
        with:
          bot_token: ${{ steps.app-token.outputs.token }}
          bot_username: ${{ vars.BOT_USERNAME }}

  sync-contributing:
    name: Sync contributing files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: awinogradov/code-assistants/.github/actions/contributing-sync@main
        with:
          bot_token: ${{ steps.app-token.outputs.token }}
          bot_username: ${{ vars.BOT_USERNAME }}
