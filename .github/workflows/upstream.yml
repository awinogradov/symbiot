name: Upstream

on:
  schedule:
    # Every hour at minute 0 (UTC). Picks up upstream rules/<stack>.md changes
    # within ~1h and opens a single PR via chore/sync-agents-rules branch.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: upstream-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync agent rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: awinogradov/code-assistants/.github/actions/agents-rules-sync@main
        with:
          token: ${{ secrets.GH_TOKEN }}
