name: Perf

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR runs are cancelled by newer pushes to the same branch. Main runs are
# never cancelled — every commit on main must produce its own baseline
# snapshot, otherwise downstream PRs lose comparison points.
concurrency:
  # PR runs are keyed by PR number (unique across forks) so fork PRs cannot
  # collide with same-named branches in other repos. Main runs are keyed by
  # commit SHA so each main commit produces its own baseline run.
  group: >-
    ${{
      github.event_name == 'pull_request'
        && format('perf-pr-{0}', github.event.pull_request.number)
        || format('perf-main-{0}', github.sha)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  # gh run download / gh run list in the baseline-fetch step needs read
  # access to prior workflow runs and their artifacts.
  actions: read

jobs:
  perf:
    name: Report
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      HUSKY: "0"
      # Required by the gh CLI in Actions; the default GITHUB_TOKEN is sufficient
      # for gh run list / gh run download against this repository.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Cache key intentionally matches .github/workflows/pr.yml so both
      # workflows share entries instead of evicting each other.
      - name: Restore Turborepo + Bun cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            ~/.bun/install/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build viewer
        run: bun run --filter @symbiot/viewer build

      # Multi-chunk build (dist/client) + treemap — this is what Lighthouse
      # serves and measures (the real served experience).
      - name: Bundle analyze
        run: bun run --filter @symbiot/viewer bundle-analyze

      # Single-file embed build (dist/embed/index.html) — the self-contained
      # blob agent binaries ship. The bundle-size metric tracks this so the
      # number stays comparable to the historical single-file baseline instead
      # of measuring the ~1.4 KiB multi-chunk shell. Empties dist/embed only, so
      # the dist/client output Lighthouse serves is untouched.
      - name: Build embed artifact
        working-directory: apps/viewer
        run: SYMBIOT_SINGLEFILE=1 bunx vite build

      # Lighthouse can flake on shared runners. Continue on error so a bad LH
      # run degrades the comment to "measurement failed" instead of failing
      # the whole workflow.
      - name: Run Lighthouse
        id: lighthouse
        continue-on-error: true
        run: bun run perf

      # head_ref is attacker-controllable on PRs (a fork can name its branch
      # `foo"$(cmd)`). Route ref-derived values through env vars and build
      # meta.json via jq so values are JSON-escaped and never re-evaluated by
      # the shell.
      - name: Snapshot head perf outputs
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          HEAD_RUN_ID: ${{ github.run_id }}
          HEAD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LH_OUTCOME: ${{ steps.lighthouse.outcome }}
        run: |
          set -eo pipefail
          mkdir -p perf-snapshot
          cp apps/viewer/dist/embed/index.html perf-snapshot/index.html
          if [ -f apps/viewer/bundle-stats/index.html ]; then
            cp apps/viewer/bundle-stats/index.html perf-snapshot/bundle-stats.html
          fi
          LH_STATUS="failed"
          if [ "$LH_OUTCOME" = "success" ] && [ -f perf-reports/lighthouse-viewer.json ]; then
            cp perf-reports/lighthouse-viewer.json perf-snapshot/lighthouse-viewer.json
            LH_STATUS="success"
          fi
          jq -n \
            --arg sha "$HEAD_SHA" \
            --arg ref "$HEAD_REF" \
            --arg runId "$HEAD_RUN_ID" \
            --arg runUrl "$HEAD_RUN_URL" \
            --arg lhStatus "$LH_STATUS" \
            '{sha: $sha, ref: $ref, runId: $runId, runUrl: $runUrl, lhStatus: $lhStatus}' \
            > perf-snapshot/meta.json

      # Walk back through up to 5 recent successful main runs and pull the first
      # one that still has the artifact (older runs may have expired). Always
      # exit 0 — a missing baseline must not fail the workflow.
      #
      # Fork PR guard: `pull-requests: write` is not granted to fork
      # `pull_request` runs, so anything that posts to the API would fail with
      # 403. Skip the baseline-fetch + comment-generate + sticky-comment steps
      # entirely on fork PRs.
      - name: Find baseline (main)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set +e
          mkdir -p perf-baseline
          RUN_IDS=$(gh run list \
            --branch main \
            --workflow perf.yml \
            --status success \
            --limit 5 \
            --json databaseId \
            --jq '.[].databaseId' 2>/dev/null)
          if [ -z "$RUN_IDS" ]; then
            echo "No successful main runs yet — head-only mode."
            exit 0
          fi
          for id in $RUN_IDS; do
            echo "Trying baseline from run $id..."
            if gh run download "$id" --name perf-snapshot-main --dir perf-baseline/ 2>/dev/null; then
              echo "Baseline downloaded from run $id."
              exit 0
            fi
          done
          echo "All recent main runs had no usable artifact — head-only mode."
          rm -rf perf-baseline
          mkdir -p perf-baseline
          exit 0

      # MUST exit 0 — the gate lives in a future issue; do not add
      # --fail-on-regression here.
      - name: Generate comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          bun run scripts/perf-report.ts \
            --head perf-snapshot \
            --base perf-baseline \
            > perf-comment.md || true

      # Sticky comment posts once per PR and updates in place on subsequent
      # pushes. Gated to same-repo PRs because fork PRs do not get
      # `pull-requests: write` on the default GITHUB_TOKEN. `continue-on-error`
      # is a belt-and-suspenders safety net for token edge cases.
      - name: Sticky perf comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: Perf
          path: perf-comment.md

      - name: Upload perf snapshot
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{
              github.event_name == 'pull_request'
                && format('perf-snapshot-pr-{0}', github.event.pull_request.number)
                || 'perf-snapshot-main'
            }}
          path: perf-snapshot/
          retention-days: 30
          if-no-files-found: error
