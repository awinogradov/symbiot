name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: darwin-arm64
          - os: macos-14
            triple: darwin-x64
          - os: ubuntu-latest
            triple: linux-x64
          - os: windows-latest
            triple: windows-x64
    env:
      CI: "true"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build viewer (single-file HTML + gzip)
        run: bun --filter @symbiot/viewer build

      - name: Compile binaries (claude-code + codex + gemini + copilot)
        shell: bash
        run: |
          bun --filter @symbiot/claude-code compile:${{ matrix.triple }}
          bun --filter @symbiot/codex compile:${{ matrix.triple }}
          bun --filter @symbiot/gemini compile:${{ matrix.triple }}
          bun --filter @symbiot/copilot compile:${{ matrix.triple }}

      - name: Stage binaries for this platform
        shell: bash
        run: |
          mkdir -p staging
          cp apps/claude-code/dist/bin/symbiot-${{ matrix.triple }}* staging/
          cp apps/codex/dist/bin/symbiot-codex-${{ matrix.triple }}* staging/
          cp apps/gemini/dist/bin/symbiot-gemini-${{ matrix.triple }}* staging/
          cp apps/copilot/dist/bin/symbiot-copilot-${{ matrix.triple }}* staging/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.triple }}
          path: staging/*
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS
        working-directory: artifacts
        run: shasum -a 256 symbiot-* > SHA256SUMS

      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/symbiot-* artifacts/SHA256SUMS

      - name: Open version-bump PR
        run: |
          BR="release-${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          # claude-code's shim reads only its own four binaries; keep its in-repo
          # SHA256SUMS limited to those (the release asset carries every agent's hashes).
          awk '$2 ~ /^symbiot-(darwin-arm64|darwin-x64|linux-x64|windows-x64\.exe)$/' \
            artifacts/SHA256SUMS > apps/claude-code/bin/SHA256SUMS
          printf '%s\n' "${GITHUB_REF_NAME}" > apps/claude-code/bin/VERSION
          VER="${GITHUB_REF_NAME#v}"
          # Repo-wide single version: bump the "version" field in every version-bearing manifest so
          # all integrations stay in lockstep with the tag. A JSON parse-and-rewrite reformats em-dashes,
          # inline objects, and arrays, which fails `bun run format:check`, so use a targeted sed on the
          # first "version" key only (in each package.json that is the package version, before deps).
          manifests="apps/claude-code/.claude-plugin/plugin.json apps/gemini/extension/gemini-extension.json apps/claude-code/package.json apps/codex/package.json apps/copilot/package.json apps/gemini/package.json apps/opencode-plugin/package.json apps/viewer/package.json"
          for m in $manifests; do
            sed -i '1,/"version":/ s/"version": "[^"]*"/"version": "'"$VER"'"/' "$m"
            grep -q "\"version\": \"$VER\"" "$m" || { echo "version bump did not land in $m"; exit 1; }
          done
          git add apps/claude-code/bin/SHA256SUMS apps/claude-code/bin/VERSION $manifests
          git commit -m "chore(release): ${GITHUB_REF_NAME}"
          git push -u origin "$BR"
          gh pr create \
            --base main \
            --head "$BR" \
            --title "Release ${GITHUB_REF_NAME}" \
            --body "Auto-generated by .github/workflows/release.yml for tag ${GITHUB_REF_NAME}. Syncs apps/claude-code/bin/SHA256SUMS and bin/VERSION to the new release assets and bumps every integration manifest (claude-code plugin.json, gemini-extension.json, and all apps/* package.json) to ${VER}."

  npm-publish:
    name: Publish @symbiot/opencode-plugin to npm
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        # bun audit has no production-only scope, so gate on critical advisories only:
        # dev/build-tool advisories (vite, @babel/core, js-yaml, launch-editor) are not
        # shipped in the compiled artifacts and must not block the release publish.
        run: bun audit --audit-level=critical

      - name: Build viewer (embedded asset) + opencode plugin bundle
        run: |
          bun --filter @symbiot/viewer build
          bun --filter @symbiot/opencode-plugin build

      - name: Publish (provenance) — dry-run when NPM_TOKEN is absent
        working-directory: apps/opencode-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The tag drives the published version; the in-repo bump PR lands after release.
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          # bun pm pack normalizes the workspace:* protocol and honors "files"; runtime deps
          # are bundled into dist/plugin.js, so the tarball has no unresolvable dependencies.
          bun pm pack
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set — running publish in --dry-run mode."
            npm publish ./*.tgz --access public --dry-run
          else
            npm publish ./*.tgz --provenance --access public
          fi
