name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: darwin-arm64
            artifact: symbiot-darwin-arm64
          - os: macos-14
            triple: darwin-x64
            artifact: symbiot-darwin-x64
          - os: ubuntu-latest
            triple: linux-x64
            artifact: symbiot-linux-x64
          - os: windows-latest
            triple: windows-x64
            artifact: symbiot-windows-x64.exe
    env:
      CI: "true"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build viewer (single-file HTML + gzip)
        run: bun --filter @symbiot/viewer build

      - name: Compile hook binary
        working-directory: apps/hook
        run: bun run compile:${{ matrix.triple }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/hook/dist/bin/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS
        working-directory: artifacts
        run: shasum -a 256 symbiot-* > SHA256SUMS

      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/symbiot-* artifacts/SHA256SUMS

      - name: Open version-bump PR
        run: |
          BR="release-bump-${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          cp artifacts/SHA256SUMS apps/hook/bin/SHA256SUMS
          printf '%s\n' "${GITHUB_REF_NAME}" > apps/hook/bin/VERSION
          # Bump plugin.json version to match (strip leading 'v').
          VER="${GITHUB_REF_NAME#v}"
          python -c "import json,sys; p=json.load(open('apps/hook/.claude-plugin/plugin.json')); p['version']='${VER}'; json.dump(p, open('apps/hook/.claude-plugin/plugin.json','w'), indent=2); open('apps/hook/.claude-plugin/plugin.json','a').write('\n')"
          git add apps/hook/bin/SHA256SUMS apps/hook/bin/VERSION apps/hook/.claude-plugin/plugin.json
          git commit -m "chore(release): bump to ${GITHUB_REF_NAME}"
          git push -u origin "$BR"
          gh pr create \
            --base main \
            --head "$BR" \
            --title "chore(release): bump to ${GITHUB_REF_NAME}" \
            --body "Auto-generated by .github/workflows/release.yml for tag ${GITHUB_REF_NAME}. Updates apps/hook/bin/SHA256SUMS, apps/hook/bin/VERSION, and apps/hook/.claude-plugin/plugin.json to match the new release assets."
