name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pr:
    name: Check
    runs-on: ubuntu-latest
    # Chromium full suite + Firefox/WebKit @smoke (cross-browser NFR-6 matrix);
    # the extra engines' cold launch needs headroom over the prior Chromium-only 20.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      CI: "true"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore Turborepo + Bun cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            ~/.bun/install/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Ban time-based waits in features
        shell: bash
        run: |
          set -euo pipefail
          feature_hits=$(grep -rEn '^\s*(And |Given |When |Then )?I (wait|pause|sleep)( |$)' features/ --include='*.feature' || true)
          ts_hits=$(grep -rEn 'waitForTimeout\(|(^|[^.])setTimeout\(|globalThis\.setTimeout\(' features/ --include='*.ts' || true)
          if [[ -n "$feature_hits" || -n "$ts_hits" ]]; then
            echo "::error::Time-based waits found in features/ (issue #131). Wait on selectors, assertions, or page.waitForFunction. See features/README.md."
            [[ -n "$feature_hits" ]] && echo "$feature_hits"
            [[ -n "$ts_hits" ]] && echo "$ts_hits"
            exit 1
          fi

      - name: Enforce data-testid-only selectors in features
        shell: bash
        run: |
          set -euo pipefail
          getter_hits=$(grep -rPn 'getBy(Role|Text|Label|Placeholder|AltText|Title)\(' features/steps/ --include='*.ts' || true)
          locator_hits=$(grep -rPn '\.locator\(\s*["'\''`](?!\[data-testid)' features/steps/ --include='*.ts' || true)
          # The lookahead above only guards the *leading* token; a selector may
          # still start with [data-testid…] yet embed a framework-internal attr
          # in a descendant (e.g. `[data-testid=…] [data-slate-node=…]` or
          # `[data-testid=…] span[style*=…]`). Ban those attribute selectors too.
          embedded_hits=$(grep -rPn '\[(data-slate-|data-radix-)|style[\^\$\*~]?=' features/steps/ --include='*.ts' || true)
          if [[ -n "$getter_hits" || -n "$locator_hits" || -n "$embedded_hits" ]]; then
            echo "::error::Non-data-testid selectors found in features/steps (issues #141/#132). Use getByTestId or .locator('[data-testid=...]'). See docs/testing.md#playwright-bdd-selectors."
            [[ -n "$getter_hits" ]] && echo "$getter_hits"
            [[ -n "$locator_hits" ]] && echo "$locator_hits"
            [[ -n "$embedded_hits" ]] && echo "$embedded_hits"
            exit 1
          fi

      - name: Lint check
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Coverage
        run: bun run coverage

      - name: Coverage PR comment
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Unit

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(bunx playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      # Browser binaries live in ~/.cache/ms-playwright, which the Turbo/Bun cache
      # key above does not cover — without this, all three engines re-download on
      # every run. Keyed on the Playwright version so a bump re-primes the cache.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium firefox webkit

      # On a cache hit the binaries are restored but the apt system libs are not
      # cached, so re-add them for all three engines.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium firefox webkit

      # Chromium runs the full suite with V8 coverage (the 90% BDD gate); CI=true
      # activates the firefox/webkit projects in playwright.config.ts, which run the
      # @smoke subset only (no coverage — page.coverage is Chromium-only).
      - name: BDD
        run: bun run test:e2e:coverage

      - name: BDD Coverage PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('coverage/e2e/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: BDD
          json-summary-path: coverage/e2e/coverage-summary.json
          json-final-path: coverage/e2e/coverage-final.json
          vite-config-path: vitest.config.ts
          file-coverage-root-path: ${{ github.workspace }}

      - name: Build
        run: bun run build
